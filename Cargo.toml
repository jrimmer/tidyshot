[package]
name = "tidyshot"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
description = "Screen capture, annotation and recording for Omarchy, rebuilt in Rust."

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
# pidfd_open and kill(2) for the encoder lifetime guard; the crate is already
# vendored as a transitive dependency.
libc = "0.2.190"
idna = "1.1.0"
url = "2.5.8"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[dev-dependencies]
serde_json = "1.0.154"
