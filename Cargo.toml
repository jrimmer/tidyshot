[package]
name = "tidyshot"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Screen capture, annotation and recording for Omarchy, rebuilt in Rust."

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
libc = "0.2.190"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
